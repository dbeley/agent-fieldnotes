name: klog CI

# Trust gate + deployment for an agent-fieldnotes instance.
#
# 1. Validates every entries/*.yaml against schema/klog.yaml
#    (blocks non-verifiable or schema-violating entries).
# 2. Renders the static site (HTML + machine JSON endpoints).
# 3. Deploys the built site/ to GitHub Pages on push to main.
#
# A separate `run-nix-repros` job (disabled by default) can execute the
# hermetic `repro.nix` blocks to surface stale entries — see comments below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Validate all entries against the klog schema
        run: uv run --with pyyaml python scripts/validate_klog.py entries/*.yaml

      - name: Render static site (HTML + JSON endpoints)
        run: uv run --with pyyaml python scripts/render.py

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # Optional: hermetic repro confidence. Runs each entry's `repro.nix` block
  # (if any) in a clean nix shell and reports PASS/FAIL loudly as a check so
  # stale entries get noticed. Enable by removing the `if: false`.
  run-nix-repros:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: List entries with hermetic repro.nix blocks
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import os, glob
          try:
              import yaml
          except ImportError:
              print("PyYAML not available in this job; install via setup-uv if needed.")
              raise SystemExit(0)
          for f in sorted(glob.glob("entries/*.yaml")):
              e = yaml.safe_load(open(f))
              if (e.get("repro") or {}).get("nix"):
                  print("HAS nix repro:", f)
              else:
                  print("skip        :", f)
          PY
      # A real harness extracts `repro.steps` + the `nix:` block and executes
      # them via `nix-shell --run ...`. A repro whose expected_output is not
      # observed marks the entry as stale and should flip its status.

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
