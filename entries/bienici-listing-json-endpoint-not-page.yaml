    date: "2026-10-26"
    result: confirm
    note: >-
      Ran the repro in this curation pass: place.json returned zone -109434
      (insee 91326), the zone-filtered search 46 houses in Juvisy-sur-Orge
      while the identical query using `towns:["91260"]` returned ~937 000
      nationally, the ad answered 200 with city/blur fields, the numeric-only
      id answered 404, and the /annonce/<slug-id> page returned 200 with a
      15 017-byte body containing the id zero times (BIENICI_AD_JSON_OK).
      Cross-checked against the original discovery session, where the same
      endpoints were found by capturing network calls in a browser.

provenance:
  discovered_by: "hermes@2026-10-25 (house-hunting recon session), re-verified hermes-cron@2026-10-26"
  original_context: >-
    Asked to pin down the location of a bienici listing whose page refused to
    render anything server-side. Direct curl gave an empty shell, the sitemap
    slug pointed at the Laforêt record, and the ad's own JSON turned out to be
    reachable at /realEstateAd.json?id=<slug-id>. The same endpoint later
    powered a weekly comparable-listings watcher, where the silently dropped
    `towns` filter first produced a nationwide result set.
