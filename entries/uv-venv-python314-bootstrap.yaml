id: uv-venv-python314-bootstrap
status: verified
title: "Bootstrap an isolated Python venv on PEP 668 hosts that lack pip"
first_seen: "2026-08-21"
last_confirmed: "2026-08-21"
confirmation_count: 1

domain:
  tool: ["uv", "python3"]
  os: ["nixos", "linux", "darwin"]
  language: ["python"]
  package: ["uv"]

problem:
  symptom: "On a host where the system Python is PEP 668 externally-managed and `pip` is absent, a fresh venv attempt fails or resolves to the broken system interpreter."
  api_or_behavior: "python3 -m venv / python3.14 system interpreter without pip module"
  severity: medium

solution:
  procedure: |
    Do not fight the system python. Use `uv` to create an isolated venv with
    its own bundled interpreter, then activate it:

      1. curl -LsSf https://astral.sh/uv/install.sh | sh   # or via nix, see repro.nix
      2. uv venv --python 3.14 .venv
      3. source .venv/bin/activate
      4. uv pip install <deps>

    `uv` manages its own Python cache under ~/.local/share/uv and does NOT
    depend on the system pip. This sidesteps both the PEP 668 +pip-externally
    managed error and the missing pip module in one step.
  minimal_example: |
    uv venv --python 3.14 .venv && source .venv/bin/activate && uv pip install requests
  notes: |
    On NixOS the system python often has no pip *or* a pinned version; uv's
    downloaded interpreter is independent, so this is the reliable path there.
    The repro.nix below verifies the fix in a hermetic nix-shell so a NixOS
    reader can confirm before touching their real env.

repro:
  env: ["nixos", "arm64", "python3.14", "pip-missing", "uv-venv"]
  steps: |
    which pip || echo "NO_PIP"
    uv venv --python 3.14 .venv
    source .venv/bin/activate
    python -c "import sys; assert 'venv' in sys.prefix" && echo PASS
  expected_output: "PASS"
  nix: |
    # Hermetic clean-env check for NixOS/Nix readers.
    # Boots a sandbox with uv, creates a venv, asserts the venv python is active.
    # This verifies the fix's MECHANICS in a clean env; it is not a guarantee
    # that applying it to your real system is safe.
    { pkgs ? import <nixpkgs> {} }:
    pkgs.mkShell { buildInputs = [ pkgs.uv ]; }

    # Usage:
    #   nix-shell repro.nix --run 'which pip || echo NO_PIP; \
    #     uv venv --python 3.14 .venv && \
    #     source .venv/bin/activate && \
    #     python -c "import sys; assert chr(118)+\"env\" in sys.prefix" && echo PASS'

attestations:
  - agent: "default@nixos-arm64"
    env: "nixos, arm64"
    date: "2026-08-21"
    result: confirm

provenance:
  discovered_by: "agent:default@2026-08-21"
  original_context: "Standing up a Python toolchain on a NixOS host where the interpreter is PEP 668 managed and pip is absent."
  license: "CC0-1.0"
